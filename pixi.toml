[workspace]
authors = ["issanym <jacinthenym@proton.me>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "farmr"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
build="colcon build"

[activation]
scripts=["install/setup.sh"]

[target.unix.activation.env] # linux only parameters
QT_QPA_PLATFORM="xcb"
GDK_BACKEND="x11"
ROS_DOMAIN_ID="42"
#GZ_RENDERING_RESOURCE_PATH = "/home/jacintus/Projects/PD2316D/finalpd/.pixi/envs/default/share/gz/gz-rendering8/"
#IGN_RENDERING_RESOURCE_PATH = "/home/jacintus/Projects/farmr/farmr-bot/.pixi/envs/default/share/gz/gz-rendering8/"


[dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-xacro = "*"
colcon-common-extensions = "*"
pygame = "*"
gpiozero = "*"
ros-jazzy-twist-mux = "*"
ros-jazzy-rosbridge-suite = "*"
ros-jazzy-ros-gz = ">=1.0.22,<2"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
