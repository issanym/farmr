[workspace]
authors = ["issanym <jacinthenym@proton.me>"]
channels = ["robostack-humble", "conda-forge"]
name = "farmr"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
build="colcon build"

[activation]
scripts=["install/setup.sh"]

[target.unix.activation.env] # linux only parameters
QT_QPA_PLATFORM="xcb"
GDK_BACKEND="x11"
ROS_DOMAIN_ID="42"

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
ros-humble-rviz2 = ">=11.2.26,<12"
ros-humble-robot-state-publisher = ">=3.0.3,<4"
ros-humble-xacro = ">=2.1.1,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
pygame = ">=2.6.1,<3"
gpiozero = ">=2.0.1,<3"
